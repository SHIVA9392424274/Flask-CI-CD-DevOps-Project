<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | College Event Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>College Event Management System</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/events">Events</a>
        <a href="/admin">Admin</a>
    </nav>
</header>

<main>

    <h2>Upcoming Events</h2>

    <div class="events-container">

        {% for event in events %}

        <div class="event-card">

            <h3>{{ event.name }}</h3>

            <p>
                <strong>Date:</strong>
                {{ event.date }}
            </p>

            <p>
                <strong>Venue:</strong>
                {{ event.venue }}
            </p>

            <p>{{ event.description }}</p>

            <a class="button"
               href="{{ url_for('register', event_id=event.id) }}">
                Register Now
            </a>

        </div>

        {% endfor %}

    </div>

</main>

<footer>
    <p>College Event Management System</p>
</footer>

</body>
</html>
