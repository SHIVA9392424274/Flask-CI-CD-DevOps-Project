<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - {{ event.name }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="nav-container">

        <a href="/" class="logo">
            🎓 College<span>Events</span>
        </a>

        <ul class="nav-links">

            <li>
                <a href="/">Home</a>
            </li>

            <li>
                <a href="/events">Events</a>
            </li>

            <li>
                <a href="/admin">Admin</a>
            </li>

        </ul>

    </div>

</nav>


<section class="page-header">

    <h1>Event Registration</h1>

    <p>
        Join us and be part of the event
    </p>

</section>


<div class="form-wrapper">

    <div class="form-card">

        <h2>Register for</h2>

        <h3 class="event-name">
            {{ event.name }}
        </h3>

        <form method="POST">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <select id="department"
                        name="department"
                        required>

                    <option value="">
                        Select Department
                    </option>

                    <option value="CSE">
                        Computer Science & Engineering
                    </option>

                    <option value="ECE">
                        Electronics & Communication Engineering
                    </option>

                    <option value="EEE">
                        Electrical & Electronics Engineering
                    </option>

                    <option value="MECH">
                        Mechanical Engineering
                    </option>

                    <option value="CIVIL">
                        Civil Engineering
                    </option>

                    <option value="AIML">
                        Artificial Intelligence & Machine Learning
                    </option>

                </select>

            </div>


            <button type="submit"
                    class="btn btn-primary">

                Complete Registration →

            </button>

        </form>

    </div>

</div>


<footer>

    <p>
        © 2026 College Event Management System
    </p>

</footer>

</body>

</html>
